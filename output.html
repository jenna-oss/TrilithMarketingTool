<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Output — Private Real Estate Lending</title>
<script src="./assets/theme.js"></script>
<link rel="stylesheet" href="./assets/nav.css">
<style>
  :root {
    --cream-text:#EAE9D5; --emerald:#2C785E; --emerald-bar:#407C62; --sage:#6E9C86;
    --ground:#ECE9D8; --panel:#0B3529; --card:#F4F2E7; --card-sunk:#E3DFCB;
    --ink:#103224; --ink-body:#3B5850; --ink-quiet:#6F8279;
    --rule:#D2CDB6; --rule-strong:#B8B29A; --accent:#2C785E; --clay:#A65A3C; --ochre:#B5823F;
    --sans:"Poppins","Century Gothic","Avenir Next","Futura",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"Cascadia Mono","Cascadia Code","SF Mono",Consolas,monospace;
    --s1:.5rem; --s2:.75rem; --s3:1rem; --s4:1.5rem; --s5:2rem; --s6:3rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#072A1F; --card:#0E3B2C; --card-sunk:#0A3125;
      --ink:#EAE9D5; --ink-body:#B9C9C0; --ink-quiet:#7E9A8D;
      --rule:#1C4A3A; --rule-strong:#2A5D4A; --accent:#6E9C86; --clay:#C87A57; --ochre:#D0A05C;
    }
  }
  /* The toggle writes data-theme; without these the palette would only ever
     follow the operating system and the control would do nothing here. */
  :root[data-theme="light"] {
    --ground:#ECE9D8; --card:#F4F2E7; --card-sunk:#E3DFCB;
    --ink:#103224; --ink-body:#3B5850; --ink-quiet:#6F8279;
    --rule:#D2CDB6; --rule-strong:#B8B29A; --accent:#2C785E; --clay:#A65A3C; --ochre:#B5823F;
  }
  :root[data-theme="dark"] {
    --ground:#072A1F; --card:#0E3B2C; --card-sunk:#0A3125;
    --ink:#EAE9D5; --ink-body:#B9C9C0; --ink-quiet:#7E9A8D;
    --rule:#1C4A3A; --rule-strong:#2A5D4A; --accent:#6E9C86; --clay:#C87A57; --ochre:#D0A05C;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink-body);
    font-family:var(--sans); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:var(--s5) var(--s4) var(--s6); }
  h2 { color:var(--ink); font-weight:700; line-height:1.12; margin:0 0 var(--s2); font-size:1.5rem; }
  .eyebrow {
    font-size:.625rem; letter-spacing:.14em; text-transform:uppercase;
    font-weight:700; color:var(--accent); margin:0 0 var(--s1);
  }

  .grid {
    display:grid; gap:var(--s3);
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
  }
  .vid {
    background:var(--card); border:1px solid var(--rule); border-radius:4px;
    overflow:hidden; display:flex; flex-direction:column; text-align:left;
    font-family:var(--sans); cursor:pointer; padding:0;
  }
  .vid:hover { border-color:var(--accent); }
  .vid:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* 9:16 — every preview surface on this page is portrait. */
  .vid .frame {
    aspect-ratio:9/16; background:var(--card-sunk); position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  /* The card preview is the video itself, paused on an early frame — there are
     no thumbnails, and preload="metadata" fetches only enough to draw one. */
  .vid .frame video { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .vid .play {
    position:absolute; inset:0; margin:auto; width:2.75rem; height:2.75rem;
    border-radius:50%; background:#0B3529cc; display:flex; align-items:center; justify-content:center;
  }
  .vid .play::after {
    content:""; margin-left:.2rem;
    border-left:.8rem solid #EAE9D5; border-top:.5rem solid transparent; border-bottom:.5rem solid transparent;
  }
  .vid .dur {
    position:absolute; right:.375rem; bottom:.375rem;
    font-family:var(--mono); font-size:.625rem; color:#EAE9D5;
    background:#0B3529cc; padding:.125rem .375rem; border-radius:2px;
  }
  .vid .body { padding:.625rem .75rem; }
  .vid .t { font-weight:700; color:var(--ink); font-size:.875rem; line-height:1.3; }
  .vid .m { font-family:var(--mono); font-size:.625rem; color:var(--ink-quiet); margin-top:.375rem; }

  .state { font-size:.875rem; color:var(--ink-quiet); }

  /* Two tabs, one question each: what still needs a look, and what is live. */
  .tabs {
    display:flex; gap:var(--s4); margin:var(--s3) 0 var(--s4);
    border-bottom:1px solid var(--rule);
  }
  .tabs button {
    display:inline-flex; align-items:center; gap:.5rem;
    font-family:var(--sans); font-size:.9375rem; font-weight:600; color:var(--ink-quiet);
    background:none; border:none; border-bottom:2px solid transparent;
    padding:.5rem 0; margin-bottom:-1px; cursor:pointer;
  }
  .tabs button:hover { color:var(--ink); }
  .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .tabs button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tabs .count {
    font-family:var(--mono); font-size:.6875rem; font-weight:600; color:var(--ink-body);
    background:var(--card-sunk); border:1px solid var(--rule); border-radius:999px;
    padding:0 .5rem; line-height:1.5;
  }

  .toast {
    position:fixed; left:50%; bottom:1.5rem; transform:translateX(-50%);
    background:var(--panel); color:var(--cream-text); font-size:.875rem;
    padding:.5rem 1.125rem; border-radius:999px; box-shadow:0 4px 18px #0000003d;
  }

  .empty {
    border:1px solid var(--rule); border-radius:4px; background:var(--card);
    padding:var(--s6) var(--s4); text-align:center;
  }
  .empty h3 { margin:0 0 var(--s2); color:var(--ink); font-size:1rem; }
  .empty p { margin:0 auto var(--s3); max-width:46ch; font-size:.875rem; }
  .btn {
    display:inline-block; font-family:var(--sans); font-size:.875rem; font-weight:600;
    color:#F4F2E7; background:var(--emerald); border:none; border-radius:4px;
    padding:.5625rem 1.125rem; cursor:pointer; text-decoration:none;
  }
  .btn:hover { background:var(--emerald-bar); }
  .btn.secondary { background:transparent; color:var(--ink-body); border:1px solid var(--rule-strong); }
  .btn.secondary:hover { background:var(--card-sunk); }
  .btn:disabled { opacity:.6; cursor:default; }

  /* Detail — the brief that produced the video, which is the point of the page */
  dialog.detail {
    border:1px solid var(--rule-strong); border-radius:8px; padding:0;
    background:var(--ground); color:var(--ink-body); max-width:52rem; width:calc(100vw - 2rem);
  }
  dialog.detail::backdrop { background:#07201799; }
  .detail-head {
    display:flex; align-items:center; gap:.625rem;
    background:var(--panel); color:var(--cream-text); padding:.75rem 1rem;
  }
  .detail-head h3 { margin:0; font-size:.9375rem; color:var(--cream-text); }
  .detail-close {
    margin-left:auto; background:transparent; border:none; cursor:pointer;
    color:var(--sage); font-size:1.25rem; line-height:1; padding:.25rem .5rem;
  }
  .detail-close:hover { color:var(--cream-text); }
  .detail-body { display:grid; grid-template-columns:minmax(0,280px) 1fr; gap:var(--s4); padding:var(--s4); }
  .detail-body video, .detail-body .frame-lg {
    width:100%; aspect-ratio:9/16; background:var(--card-sunk); border-radius:4px;
  }
  .detail dt {
    font-size:.625rem; letter-spacing:.14em; text-transform:uppercase;
    font-weight:700; color:var(--accent); margin-top:var(--s3);
  }
  .detail dt:first-of-type { margin-top:0; }
  .detail dd { margin:.25rem 0 0; font-size:.875rem; }
  .detail .line { font-style:italic; color:var(--ink); border-left:2px solid var(--emerald-bar); padding-left:.625rem; }
  .actions {
    display:flex; flex-wrap:wrap; align-items:center; gap:.75rem;
    margin-top:var(--s4); padding-top:var(--s3); border-top:1px solid var(--rule);
  }
  .action-note { font-size:.8125rem; color:var(--ink-quiet); }
  .action-note.bad { color:var(--clay); }
  @media (max-width:640px) { .detail-body { grid-template-columns:1fr; } }

</style>
</head>
<body>

<header class="site-head">
  <a class="site-brand" href="./">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13.5" fill="none" stroke="#6E9C86" stroke-width="1.25"/>
      <text x="15" y="18.5" text-anchor="middle" fill="#EAE9D5"
            font-family="Poppins, Century Gothic, sans-serif" font-size="7.5" font-weight="700">AIKO</text>
    </svg>
    <span>
      <span class="name">Trilith marketing tool</span><br>
      <span class="who">aikogroup.io — internal</span>
    </span>
  </a>

  <nav class="site-nav" aria-label="Sections">
    <span class="nav-group">
      <span class="nav-group-label">Intelligence</span>
      <a class="nav-link" href="./briefing.html">Competitors</a>
      <a class="nav-link" href="./creators.html">Creators</a>
    </span>
    <span class="nav-group">
      <span class="nav-group-label">Production</span>
      <a class="nav-link" href="./">Plan</a>
      <a class="nav-link" href="./output.html" aria-current="page">Output</a>
    </span>
    <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Toggle light and dark theme" aria-pressed="false">
      <span data-theme-label>Dark</span>
    </button>
  </nav>
</header>

<main class="wrap">
  <p class="eyebrow">Library</p>
  <h2>Videos</h2>

  <div class="tabs" role="tablist" aria-label="Video status">
    <button type="button" role="tab" data-tab="review" aria-selected="true" aria-controls="grid">
      Ready to review <span class="count" id="count-review">0</span>
    </button>
    <button type="button" role="tab" data-tab="posted" aria-selected="false" aria-controls="grid">
      Posted <span class="count" id="count-posted">0</span>
    </button>
  </div>

  <p class="state" id="state" role="status">Loading videos…</p>

  <div class="grid" id="grid" role="tabpanel"></div>

  <div class="empty" id="empty" hidden>
    <h3 id="empty-title"></h3>
    <p id="empty-text"></p>
    <a class="btn" id="empty-cta" href="./">Go to planning</a>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<dialog class="detail" id="detail">
  <div class="detail-head">
    <h3 id="detail-title">Video</h3>
    <button class="detail-close" id="detail-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
</dialog>

<script>
/* Same Worker as the Plan page. It reads the render records and hands back
   finished videos only — anything that failed or has no narration stays out. */
const WORKER_URL = 'https://trilith-ask.jenna-cbd.workers.dev';

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const emptyTitle = document.getElementById('empty-title');
const emptyText = document.getElementById('empty-text');
const emptyCta = document.getElementById('empty-cta');
const stateEl = document.getElementById('state');
const detail = document.getElementById('detail');
const detailBody = document.getElementById('detail-body');
const detailTitle = document.getElementById('detail-title');
const tabButtons = [...document.querySelectorAll('.tabs [role="tab"]')];
const countReview = document.getElementById('count-review');
const countPosted = document.getElementById('count-posted');
const toastEl = document.getElementById('toast');

/* Shared with the Plan page, which asks for the same token when a file is
   added to the library — one team token, asked for once per browser. */
const TOKEN_KEY = 'trilith-kb-upload-token';

let videos = [];
let tab = location.hash === '#posted' ? 'posted' : 'review';

const isPosted = (v) => Boolean(v.posted_at);

/* Newest first: by when it rendered while it waits for review, by when it went
   out once it is posted. */
function inTab(name) {
  const key = name === 'posted' ? 'posted_at' : 'rendered_at';
  return videos
    .filter((v) => isPosted(v) === (name === 'posted'))
    .sort((a, b) => new Date(b[key]) - new Date(a[key]));
}

const fmtDuration = (s) => {
  if (!Number.isFinite(s) || s <= 0) return '';
  const m = Math.floor(s / 60);
  const r = Math.round(s % 60);
  return m + ':' + String(r).padStart(2, '0');
};
const fmtDate = (iso) => {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};

async function load() {
  try {
    const res = await fetch(WORKER_URL + '/videos', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{}',
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    videos = Array.isArray(data.videos) ? data.videos : [];
  } catch (err) {
    console.error('videos failed to load:', err);
    stateEl.textContent = 'Couldn’t load the videos. Try refreshing the page.';
    return;
  }
  stateEl.hidden = true;
  render();
}

function setTab(name) {
  tab = name;
  /* In the URL, so a reload or a shared link lands on the same tab. */
  history.replaceState(null, '', name === 'posted' ? '#posted' : location.pathname);
  render();
}
tabButtons.forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

function showEmpty(nReview, nPosted) {
  emptyCta.hidden = false;
  if (tab === 'posted') {
    emptyTitle.textContent = 'Nothing posted yet';
    emptyText.textContent = 'Open a video under Ready to review and mark it as posted once it’s live.';
    emptyCta.hidden = true;
  } else if (nPosted) {
    emptyTitle.textContent = 'All caught up';
    emptyText.textContent = 'Every finished video has been posted.';
    emptyCta.textContent = 'Plan more videos';
  } else {
    emptyTitle.textContent = 'No videos to review yet';
    emptyText.textContent = 'Finished videos show up here as soon as they render. Start by planning a batch.';
    emptyCta.textContent = 'Go to planning';
  }
}

function render() {
  const review = inTab('review');
  const posted = inTab('posted');
  countReview.textContent = review.length;
  countPosted.textContent = posted.length;
  tabButtons.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));

  const list = tab === 'posted' ? posted : review;
  grid.textContent = '';
  emptyEl.hidden = list.length > 0;
  if (!list.length) showEmpty(review.length, posted.length);

  list.forEach((v) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'vid';
    card.setAttribute('aria-label', 'Play: ' + (v.topic || 'video'));

    const frame = document.createElement('div');
    frame.className = 'frame';
    const preview = document.createElement('video');
    /* #t=1 lands the preview on a real frame instead of the black first one. */
    preview.src = v.url + '#t=1';
    preview.preload = 'metadata';
    preview.muted = true;
    preview.playsInline = true;
    preview.setAttribute('aria-hidden', 'true');
    const play = document.createElement('span');
    play.className = 'play';
    frame.append(preview, play);
    const dur = fmtDuration(v.duration);
    if (dur) {
      const d = document.createElement('span');
      d.className = 'dur';
      d.textContent = dur;
      frame.append(d);
    }

    const body = document.createElement('div');
    body.className = 'body';
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = v.topic || 'Untitled';
    const m = document.createElement('div');
    m.className = 'm';
    m.textContent = isPosted(v) ? 'Posted ' + fmtDate(v.posted_at) : 'Finished ' + fmtDate(v.rendered_at);
    body.append(t, m);

    card.append(frame, body);
    card.addEventListener('click', () => open(v));
    grid.append(card);
  });
}

function open(v) {
  detailTitle.textContent = v.topic || 'Video';
  detailBody.textContent = '';

  const player = document.createElement('video');
  player.src = v.url;
  player.controls = true;
  player.playsInline = true;
  player.autoplay = true;

  const dl = document.createElement('dl');
  const add = (label, value, cls) => {
    if (!value) return;
    const dt = document.createElement('dt');
    dt.textContent = label;
    const dd = document.createElement('dd');
    if (cls) dd.className = cls;
    dd.textContent = value;
    dl.append(dt, dd);
  };
  add('Opening line', v.hook ? '“' + v.hook + '”' : null, 'line');
  add('What it argues', v.angle);
  add('Loan type', v.product);
  add('Made for', v.audience);
  add('Length', fmtDuration(v.duration));
  add('Finished', fmtDate(v.rendered_at));

  /* One action, whichever way the video is facing. */
  const actions = document.createElement('div');
  actions.className = 'actions';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = isPosted(v) ? 'btn secondary' : 'btn';
  btn.textContent = isPosted(v) ? 'Move back to review' : 'Mark as posted';
  const note = document.createElement('span');
  note.className = 'action-note';
  if (isPosted(v)) note.textContent = 'Posted ' + fmtDate(v.posted_at);
  btn.addEventListener('click', async () => {
    const posting = !isPosted(v);
    btn.disabled = true;
    note.className = 'action-note';
    note.textContent = 'Saving…';
    const result = await setPosted(v.id, posting);
    if (!result.ok) {
      btn.disabled = false;
      note.className = 'action-note bad';
      note.textContent = result.error;
      return;
    }
    v.posted_at = result.posted_at;
    closeDetail();
    render();
    toast(posting ? 'Moved to Posted' : 'Moved back to Ready to review');
  });
  actions.append(btn, note);

  const left = document.createElement('div');
  left.append(player);
  const right = document.createElement('div');
  right.append(dl, actions);
  detailBody.append(left, right);
  detail.showModal();
}

function teamToken(force) {
  let token = '';
  try { if (!force) token = localStorage.getItem(TOKEN_KEY) || ''; } catch { /* private mode */ }
  if (!token) {
    token = (window.prompt('Team token (the same one used to add files to the library):') || '').trim();
    if (token) { try { localStorage.setItem(TOKEN_KEY, token); } catch { /* private mode */ } }
  }
  return token;
}

/* A rotated or mistyped token costs one re-ask, not a dead button. */
async function setPosted(id, posted) {
  let token = teamToken(false);
  if (!token) return { ok: false, error: 'No team token, so nothing changed.' };

  for (let attempt = 0; attempt < 2; attempt += 1) {
    let res;
    try {
      res = await fetch(WORKER_URL + '/videos/posted', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ id, posted }),
      });
    } catch {
      return { ok: false, error: 'Couldn’t reach the server. Try again.' };
    }
    if (res.status === 401 && attempt === 0) {
      try { localStorage.removeItem(TOKEN_KEY); } catch { /* private mode */ }
      token = teamToken(true);
      if (!token) return { ok: false, error: 'No team token, so nothing changed.' };
      continue;
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      return { ok: false, error: 'Couldn’t save' + (body.error ? ': ' + body.error : ' (' + res.status + ')') + '.' };
    }
    return { ok: true, posted_at: body.posted_at ?? null };
  }
  return { ok: false, error: 'That team token wasn’t accepted.' };
}

let toastTimer;
function toast(message) {
  toastEl.textContent = message;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
}

/* Closing the dialog must stop the sound, not just hide the player. The ×
   and the backdrop do it directly rather than relying on the dialog's close
   event, which not every browser surface fires; that event still covers
   Escape, which closes the dialog natively without touching these handlers. */
function stopPlayer() {
  const player = detailBody.querySelector('video');
  if (player) player.pause();
  detailBody.textContent = '';
}
function closeDetail() {
  stopPlayer();
  if (detail.open) detail.close();
}
detail.addEventListener('close', stopPlayer);
document.getElementById('detail-close').addEventListener('click', closeDetail);
detail.addEventListener('click', (e) => { if (e.target === detail) closeDetail(); });

load();


if (window.AikoTheme) AikoTheme.mount(document.getElementById('theme-toggle'));
</script>
</body>
</html>
