name: Render videos

# Turns a locked plan into finished videos.
#
# Briefs come from kb.planning_sessions, not from a file in this repo. That is
# the point of living in the same repo as the planner: locking a plan on the
# Plan page is what makes it renderable, with nobody copying JSON between two
# places. It also keeps a forward-looking content plan out of git history.
#
# The pipeline's stages are agents, not code — each is given prose instructions
# and does the work itself, writing a Remotion component, running the render,
# reading the error, fixing it. So this runs Claude Code headless, not a script.
#
# One job per video, fail-fast off: video 2 failing must not take 1 and 3 with
# it. Nothing is published — the artifacts are for review.

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Planning session to render. Blank = the most recently completed plan.'
        type: string
        default: ''
      only:
        description: 'Slots to render, e.g. 2 or 2,3 (blank = all of them)'
        type: string
        default: ''
      max_turns:
        description: 'Cap on agent turns per video — the runaway guard'
        type: string
        default: '120'
      model:
        description: 'Model the pipeline stages run on. The first three videos used opus, at about $5 each.'
        type: choice
        options: [sonnet, opus]
        default: sonnet

concurrency:
  group: render-videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      session: ${{ steps.build.outputs.session }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_ID: ${{ inputs.session_id }}
          ONLY: ${{ inputs.only }}
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const base = (process.env.SUPABASE_URL || '').replace(/\/+$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY || '';
          if (!base || !key) throw new Error('SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set');

          const res = await fetch(`${base}/rest/v1/rpc/kb_plans_ready`, {
            method: 'POST',
            headers: { apikey: key, authorization: `Bearer ${key}`, 'content-type': 'application/json' },
            body: JSON.stringify({ p_session_id: (process.env.SESSION_ID || '').trim() || null }),
          });
          if (!res.ok) throw new Error(`kb_plans_ready failed (${res.status})`);

          const plans = await res.json();
          if (!plans.length) {
            throw new Error('No completed plan found. Lock every slot on the Plan page first.');
          }
          const plan = plans[0];

          let slots = (plan.slots || []).map((s, i) => ({ ...s, slot: i + 1 }));
          /* A list, not a single number. Re-rendering a slot that already has a
           * video costs a full agent run and overwrites the file, so "render
           * the ones I have not done yet" has to be expressible. */
          const only = (process.env.ONLY || '').trim();
          if (only) {
            const wanted = only.split(',').map((p) => parseInt(p.trim(), 10));
            const bad = wanted.filter((n) => !Number.isInteger(n) || n < 1 || n > slots.length);
            if (bad.length) {
              throw new Error(`only=${only}: ${bad.join(', ')} out of range; this plan has ${slots.length} videos`);
            }
            slots = [...new Set(wanted)].map((n) => slots[n - 1]);
          }

          /* The pipeline takes one `topic` string. A locked slot is richer than
           * that, and the angle is what makes a video specific rather than
           * generic, so the whole brief goes in rather than the title alone. */
          const include = slots.map((s) => ({
            slot: s.slot,
            name: String(s.topic).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48),
            topic: [
              s.topic,
              plan.goal ? `BATCH GOAL: ${plan.goal}` : null,
              s.angle ? `ANGLE: ${s.angle}` : null,
              s.hook ? `OPENING LINE (use this, spoken to camera): ${s.hook}` : null,
              s.evidence ? `EVIDENCE ALREADY GATHERED: ${s.evidence}` : null,
              s.product ? `PRODUCT: ${s.product}` : null,
              s.audience ? `AUDIENCE: ${s.audience}` : null,
              (s.source_ids || []).length ? `SOURCES: ${s.source_ids.join(' , ')}` : null,
            ].filter(Boolean).join('\n\n'),
          }));

          console.log(`matrix=${JSON.stringify({ include })}`);
          console.log(`session=${plan.session_id}`);
          console.log(`count=${include.length}`);
          EOF

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Remotion brings its own headless Chrome, but not ffmpeg, and the
      # Voiceover stage muxes narration onto the render with it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          npm --prefix video/remotion ci || npm --prefix video/remotion install --no-audit --no-fund
          pip install -r video/requirements.txt

      # The pipeline is driven through Claude Code's Workflow tool, so the CLI
      # is the runtime here, not a helper.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Render video ${{ matrix.slot }} — ${{ matrix.name }}
        env:
          # The repo secret is named ANTHROPIC_API; the CLI reads ANTHROPIC_API_KEY.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API }}
          SESSION_ID: ${{ needs.plan.outputs.session }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOPIC: ${{ matrix.topic }}
          MAX_TURNS: ${{ inputs.max_turns }}
          # Every stage is an agent() call with no model of its own, so they all
          # inherit this. On opus the first three videos cost $5.0-5.6 each,
          # nearly all of it the stages; web lookups ran on haiku for ~$0.40.
          # A choice, not a hardcode, so the two can be compared on the same
          # brief before either becomes the default for good.
          MODEL: ${{ inputs.model }}
          # The Workflow tool returns immediately with a task id and runs in the
          # background, so the agent has nothing to block on and says it will
          # report back later. Claude Code then waits 600s for background work
          # and terminates it — which is exactly what happened: the pipeline was
          # rendering happily and was killed at ten minutes.
          #
          # 0 waits indefinitely. The bound that matters is the job's own
          # timeout-minutes, which is a real deadline rather than one that
          # silently truncates a working render.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'
        run: |
          set -o pipefail
          # A marker to date agent-written files against. `-newer package.json`
          # matched every file in the repo, because checkout stamps them all at
          # the same moment — so the artifact was fifteen pre-existing sources
          # around a 208-byte log.
          touch /tmp/render-start
          # A headless run has no terminal to answer a permission prompt on, so
          # the tools the pipeline needs are granted explicitly and by name. An
          # allowlist rather than a blanket bypass: it is auditable here, and
          # anything the pipeline was not built to reach is still refused.
          #
          # WebSearch is on the list because the Research stage is told to
          # "otherwise web-search it". Without it that agent cannot look
          # anything up, and the failure is the quiet kind: rather than
          # stopping, it falls back on what it already knows and produces
          # facts whose citations nobody can check.
          # stream-json, not text. In text mode the CLI prints its result
          # once, at the end, so for the whole run the log stays empty and then
          # everything lands at once. Combined with GitHub only publishing a
          # step's log when the step finishes, an unattended render was a black
          # box with a spinner on it.
          #
          # The raw stream goes to render.log for the artifact; a readable
          # digest goes to stdout. jq may fail without taking the step with it;
          # pass or fail is decided at the end of this step by what was produced,
          # not by any exit status in this pipe.
          set +e
          claude -p             --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Workflow,Agent,WebFetch,WebSearch"             --model "${MODEL:-sonnet}" --max-turns "$MAX_TURNS"             --output-format stream-json --verbose             "Run the video pipeline for one topic.

          Use the Workflow tool exactly once:

            Workflow({
              scriptPath: 'video/remotion/pipeline_workflow.mjs',
              args: { root: '$GITHUB_WORKSPACE/video', topic: <the topic below> }
            })

          Pass args.root exactly as given — the script is sandboxed and cannot
          find its own location. Do not edit the workflow script. When it
          finishes, print the absolute path of the finished mp4 on its own line
          and nothing else. If it fails, print the error and stop.

          TOPIC:
          $TOPIC" 2>&1 | tee render.log | { jq -r --unbuffered '
              if .type == "assistant" then
                (.message.content // [])[]
                | if .type == "text" then (.text // "")[0:400]
                  elif .type == "tool_use" then "  -> " + (.name // "tool")
                  else empty end
              elif .type == "result" then
                "=== " + (.subtype // "done") + " in " + (((.duration_ms // 0) / 1000) | floor | tostring) + "s ==="
              else empty end' 2>/dev/null || cat; }
          status=${PIPESTATUS[0]}
          set -e

          # Pass or fail on the thing this job exists to make: a narrated video.
          # Not on how the agent's last turn went. One run went green having
          # produced nothing, killed at 600s with exit 0; a later one went red
          # because the closing "here is the path" turn hit a credit error after
          # the files existed. Both verdicts were about the wrong thing.
          OUT_state=; OUT_path=; OUT_mean_db=
          while IFS='=' read -r k v; do
            case "$k" in state) OUT_state=$v ;; path) OUT_path=$v ;; mean_db) OUT_mean_db=$v ;; esac
          done < <(bash video/find-output.sh)

          case "$OUT_state" in
            ok)
              if [ "$status" -ne 0 ]; then
                echo "::warning::claude exited $status after the narrated video was made. The video is fine; the agent's closing turn was not. See render.log."
              fi
              echo "Finished: $OUT_path (mean ${OUT_mean_db} dB)"
              exit 0 ;;
            silent)
              echo "::error::$OUT_path exists but its audio is silent (mean ${OUT_mean_db:-n/a} dB); the narration did not make it into the mux."
              exit 1 ;;
            unnarrated)
              echo "::error::Only an unnarrated render exists ($OUT_path). The Voiceover stage did not finish (claude exit $status). See render.log."
              exit 1 ;;
            *)
              echo "::error::No video was produced (claude exit $status). See render.log."
              exit 1 ;;
          esac

      # always(): a failed render's log is the only way to learn why, and it is
      # exactly what you want when nobody watched it happen.
      - name: Collect output
        if: always()
        run: |
          mkdir -p artifact
          cp render.log artifact/ 2>/dev/null || true
          find video/remotion/out -name '*.mp4' -exec cp {} artifact/ \; 2>/dev/null || true
          find video/remotion -maxdepth 1 -name 'voiceover_*.py' -newer /tmp/render-start -exec cp {} artifact/ \; 2>/dev/null || true
          find video/remotion/src -maxdepth 1 -name '*.tsx' -newer /tmp/render-start -exec cp {} artifact/ \; 2>/dev/null || true
          echo "--- artifact contents ---"; ls -la artifact/

      # Storage is what makes a render survive. The artifact below expires in
      # fourteen days and re-rendering is not a recovery path — the Assembly
      # agent writes a fresh component every run, so the same brief does not
      # give back the same video.
      #
      # always(): a failed render is worth a row too. "Slot 2 failed at 04:12,
      # here is the run" is the question you ask later, and without the row
      # there is nothing to ask it of.
      - name: Store the video
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_ID: ${{ needs.plan.outputs.session }}
          SLOT: ${{ matrix.slot }}
          NAME: ${{ matrix.name }}
          TOPIC: ${{ matrix.topic }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_URL%/}"
          # The same judgement the render step made, from the same script, so the
          # row and the step cannot disagree about what happened. This used to
          # store the first mp4 find returned: slot 1 reached the bucket without
          # its narration, and slots 2 and 3 were recorded as rendered although
          # their Voiceover stage never ran.
          OUT_state=; OUT_path=; OUT_mean_db=
          while IFS='=' read -r k v; do
            case "$k" in state) OUT_state=$v ;; path) OUT_path=$v ;; mean_db) OUT_mean_db=$v ;; esac
          done < <(bash video/find-output.sh)

          if [ "$OUT_state" != "ok" ]; then
            case "$OUT_state" in
              unnarrated) WHY="voiceover stage did not finish; only an unnarrated render exists" ;;
              silent)     WHY="narrated file is silent (mean ${OUT_mean_db:-n/a} dB)" ;;
              *)          WHY="render produced no mp4" ;;
            esac
            # Not uploaded. An unnarrated render is not the deliverable, and under
            # the canonical path it would read as one. It stays in the artifact.
            echo "Not storing: $WHY"
            curl -sS -X POST "$BASE/rest/v1/rpc/kb_record_render" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'content-type: application/json' -d "$(jq -n --arg s "$SESSION_ID" --argjson n "$SLOT" --arg t "$TOPIC" --arg r "$RUN_URL" --arg w "$WHY" '{payload:{brand_slug:"trilith",session_id:$s,slot:$n,topic:$t,status:"failed",error:$w,run_url:$r}}')" > /dev/null
            echo "### Slot $SLOT — not finished: $WHY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MP4="$OUT_path"

          PATH_IN_BUCKET="$SESSION_ID/$SLOT-$NAME.mp4"
          BYTES=$(wc -c < "$MP4" | tr -d ' ')
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MP4" 2>/dev/null || echo "")

          echo "Uploading $MP4 ($BYTES bytes) -> videos/$PATH_IN_BUCKET"
          curl -sS -X POST "$BASE/storage/v1/object/videos/$PATH_IN_BUCKET"             -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H 'content-type: video/mp4'             -H 'x-upsert: true'             --data-binary "@$MP4" > /dev/null

          curl -sS -X POST "$BASE/rest/v1/rpc/kb_record_render"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H 'content-type: application/json'             -d "$(jq -n --arg s "$SESSION_ID" --argjson n "$SLOT" --arg t "$TOPIC"                   --arg p "$PATH_IN_BUCKET" --argjson b "$BYTES" --arg d "${DUR:-0}" --arg r "$RUN_URL" --arg f "$(basename "$MP4")" --arg m "${OUT_mean_db:-}"                   '{payload:{brand_slug:"trilith",session_id:$s,slot:$n,topic:$t,
                             storage_path:$p,bytes:$b,duration_seconds:($d|tonumber),
                             status:"rendered",run_url:$r,metadata:{source_file:$f,mean_volume_db:$m}}}')" > /dev/null

          # A signed link in the job summary, so reviewing is a click rather than
          # a download. The bucket is private; this is the only way in.
          SIGNED=$(curl -sS -X POST "$BASE/storage/v1/object/sign/videos/$PATH_IN_BUCKET"             -H "authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H 'content-type: application/json'             -d '{"expiresIn": 2592000}' | jq -r '.signedURL // empty')

          {
            echo "### Slot $SLOT — $NAME"
            echo ""
            echo "- **Size:** $(( BYTES / 1024 )) KB"
            echo "- **Narration:** mean ${OUT_mean_db:-n/a} dB, from $(basename "$MP4")"
            [ -n "$DUR" ] && echo "- **Duration:** ${DUR}s"
            echo "- **Stored:** \`videos/$PATH_IN_BUCKET\`"
            [ -n "$SIGNED" ] && echo "- **Watch (30-day link):** ${BASE}/storage/v1${SIGNED}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ matrix.slot }}-${{ matrix.name }}
          path: artifact/
          retention-days: 14
          if-no-files-found: warn
