name = "trilith-ask"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Needed so the Anthropic SDK's Node built-in imports resolve inside Workers.
compatibility_flags = ["nodejs_compat"]

# Not a secret: this URL ships in every Supabase client app.
[vars]
SUPABASE_URL = "https://kugnlobgsguxggnqiseh.supabase.co"
# Where /videos/edit starts render-videos.yml.
GITHUB_REPO = "jenna-oss/TrilithMarketingTool"

# Every five minutes, for anything scheduled to go to Instagram. Instagram has
# no scheduling of its own, so this is the waiting. A run that finds nothing due
# does nothing and costs nothing.
[triggers]
crons = ["*/5 * * * *"]

# Keys are NOT set here. Secrets in a committed file would be public.
# Set them once, from your terminal, and they stay encrypted on Cloudflare:
#
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put SUPABASE_ANON_KEY
#   npx wrangler secret put VOYAGE_API_KEY
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put ELEVENLABS_API_KEY
#   npx wrangler secret put SUPADATA_API_KEY
#   npx wrangler secret put INSTAGRAM_APP_ID
#   npx wrangler secret put INSTAGRAM_APP_SECRET
#   npx wrangler secret put INSTAGRAM_TOKEN_KEY
#
# The three Instagram keys are what lets the Schedule page publish. The app id
# and secret come from the app you create at developers.facebook.com, with
# Instagram added to it and this Worker's /instagram/callback registered as an
# OAuth redirect URI. There is no password login for Instagram and there must
# not be one here: you approve the connection on Instagram's own page.
#
# INSTAGRAM_TOKEN_KEY is 32 random bytes, base64, and it is ours, not Meta's.
# The access token is encrypted with it before it is stored, because this
# Supabase project is shared with other AIKO tools and anything holding its
# anon key can read the row. Make one with:
#
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#
# Keep it. Changing it makes the stored token unreadable and the account has to
# be connected again.
#
# ELEVENLABS_API_KEY transcribes what is uploaded or recorded on the Recordings
# page. Without it /recordings returns 503 and says so.
#
# SUPADATA_API_KEY gets the words out of a YouTube link pasted on the Plan page.
# YouTube stopped serving caption tracks to anything but its own player during
# 2026 — the signed track URL answers 200 with an empty body — so there is no
# free route left. Without this key a video still reads, but only down to its
# title, channel and description, and it is flagged as partial so the planner
# never mistakes a description for what was said.
#
# GITHUB_TOKEN lets /videos/edit start an edit in GitHub Actions. Make it a
# fine-grained personal access token limited to this one repository, with the
# single permission Actions: Read and write. Without it, edit requests return
# 503 and nothing else changes.
#
# Every route except /auth/* needs a signed-in session whose email is in
# kb.app_users (see src/auth.js). The origin allowlist in index.js stops
# browsers and nothing else, so sign-in is the lock. KB_UPLOAD_TOKEN is no
# longer used: uploads are behind sign-in like everything else.
#
# VOYAGE_API_KEY is optional. Without it the knowledge-base tools still answer,
# using keyword search alone, and every result they return is marked degraded so
# the model says the search was partial rather than concluding nothing exists.
#
# Each prompts for the value — never typed into a file or a chat window.
#
# SUPABASE_ANON_KEY must be the anon/publishable key, never the service role
# key. Anon is read-only against both corpora by RLS; the service role key
# bypasses RLS entirely and would let this endpoint rewrite them.

[observability]
enabled = true
