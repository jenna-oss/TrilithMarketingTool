<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Trilith marketing tool</title>
<script src="./assets/theme.js"></script>
<link rel="stylesheet" href="./assets/nav.css">
<style>
  :root {
    --forest:#0B3529; --cream-text:#EAE9D5; --emerald:#2C785E; --sage:#6E9C86;
    --ground:#ECE9D8; --card:#F4F2E7; --card-sunk:#E3DFCB;
    --ink:#103224; --ink-body:#3B5850; --ink-quiet:#6F8279;
    --rule:#D2CDB6; --rule-strong:#B8B29A; --accent:#2C785E; --clay:#A65A3C;
    --sans:"Poppins","Century Gothic","Avenir Next","Futura",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#072A1F; --card:#0E3B2C; --card-sunk:#0A3125;
      --ink:#EAE9D5; --ink-body:#B9C9C0; --ink-quiet:#7E9A8D;
      --rule:#1C4A3A; --rule-strong:#2A5D4A; --accent:#6E9C86; --clay:#C87A57;
    }
  }
  :root[data-theme="light"] {
    --ground:#ECE9D8; --card:#F4F2E7; --card-sunk:#E3DFCB;
    --ink:#103224; --ink-body:#3B5850; --ink-quiet:#6F8279;
    --rule:#D2CDB6; --rule-strong:#B8B29A; --accent:#2C785E; --clay:#A65A3C;
  }
  :root[data-theme="dark"] {
    --ground:#072A1F; --card:#0E3B2C; --card-sunk:#0A3125;
    --ink:#EAE9D5; --ink-body:#B9C9C0; --ink-quiet:#7E9A8D;
    --rule:#1C4A3A; --rule-strong:#2A5D4A; --accent:#6E9C86; --clay:#C87A57;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--ground); color:var(--ink-body);
    font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  main { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:3rem 1.25rem; }
  .card {
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--rule);
    border-radius:6px; padding:1.5rem 1.5rem 1.25rem;
  }
  h1 { margin:0 0 .25rem; font-size:1.25rem; color:var(--ink); }
  .sub { margin:0 0 1.25rem; font-size:.875rem; color:var(--ink-quiet); }
  label { display:block; font-size:.8125rem; font-weight:600; color:var(--ink); margin:.875rem 0 .3125rem; }
  input {
    width:100%; font:inherit; font-size:.9375rem; color:var(--ink); background:var(--ground);
    border:1px solid var(--rule-strong); border-radius:4px; padding:.5rem .625rem;
  }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button.primary {
    width:100%; margin-top:1.25rem; font:inherit; font-size:.9375rem; font-weight:600;
    background:var(--emerald); color:#F4F2E7; border:none; border-radius:4px; padding:.625rem 1rem; cursor:pointer;
  }
  button.primary:disabled { opacity:.55; cursor:not-allowed; }
  .links { display:flex; justify-content:space-between; gap:1rem; margin-top:1rem; font-size:.8125rem; }
  .links button {
    background:none; border:none; padding:0; font:inherit; color:var(--accent);
    cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }
  .msg { margin:1rem 0 0; font-size:.8125rem; border-radius:4px; padding:.5rem .625rem; }
  .msg.bad { background:var(--card-sunk); color:var(--clay); }
  .msg.ok { background:var(--card-sunk); color:var(--ink-body); }
  .msg[hidden], form[hidden] { display:none; }
</style>
</head>
<body>

<header class="site-head">
  <span class="site-brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13.5" fill="none" stroke="#6E9C86" stroke-width="1.25"/>
      <text x="15" y="18.5" text-anchor="middle" fill="#EAE9D5"
            font-family="Poppins, Century Gothic, sans-serif" font-size="7.5" font-weight="700">AIKO</text>
    </svg>
    <span>
      <span class="name">Trilith marketing tool</span><br>
      <span class="who">aikogroup.io — internal</span>
    </span>
  </span>
</header>

<main>
  <div class="card">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="sub">For people on this app’s list.</p>

    <form id="f-signin" novalidate>
      <label for="si-email">Email</label>
      <input id="si-email" type="email" autocomplete="username" required>
      <label for="si-password">Password</label>
      <input id="si-password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <div class="links">
        <button type="button" data-go="signup">Create an account</button>
        <button type="button" data-go="forgot">Forgot password?</button>
      </div>
    </form>

    <form id="f-signup" novalidate hidden>
      <label for="su-email">Email</label>
      <input id="su-email" type="email" autocomplete="username" required>
      <label for="su-password">Password</label>
      <input id="su-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="su-confirm">Password again</label>
      <input id="su-confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button class="primary" type="submit">Create account</button>
      <div class="links"><button type="button" data-go="signin">I have an account</button></div>
    </form>

    <form id="f-forgot" novalidate hidden>
      <label for="fp-email">Email</label>
      <input id="fp-email" type="email" autocomplete="username" required>
      <button class="primary" type="submit">Send a reset link</button>
      <div class="links"><button type="button" data-go="signin">Back to sign in</button></div>
    </form>

    <form id="f-reset" novalidate hidden>
      <label for="rp-password">New password</label>
      <input id="rp-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="rp-confirm">New password again</label>
      <input id="rp-confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button class="primary" type="submit">Save password</button>
    </form>

    <p class="msg" id="msg" role="status" hidden></p>
  </div>
</main>

<script>
/* Sign-in talks only to the Worker's /auth routes; the Worker holds the
   database key. The session it hands back is kept where assets/auth.js on
   every other page looks for it. */
const WORKER = 'https://trilith-ask.jenna-cbd.workers.dev';
const KEY = 'aiko-session';
const MIN_PASSWORD = 8;

const forms = {
  signin: document.getElementById('f-signin'),
  signup: document.getElementById('f-signup'),
  forgot: document.getElementById('f-forgot'),
  reset: document.getElementById('f-reset'),
};
const titles = {
  signin: ['Sign in', 'For people on this app’s list.'],
  signup: ['Create an account', 'Only emails on this app’s list can create one.'],
  forgot: ['Reset your password', 'We’ll email you a link.'],
  reset: ['Choose a new password', `At least ${MIN_PASSWORD} characters.`],
};
const msg = document.getElementById('msg');

function say(text, tone) {
  msg.textContent = text || '';
  msg.className = 'msg ' + (tone || 'ok');
  msg.hidden = !text;
}

function show(which, keepMessage) {
  Object.entries(forms).forEach(([k, f]) => { f.hidden = k !== which; });
  document.getElementById('title').textContent = titles[which][0];
  document.getElementById('sub').textContent = titles[which][1];
  if (!keepMessage) say('');
  const first = forms[which].querySelector('input');
  if (first) first.focus();
}

document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => show(b.dataset.go)));

/* Where to go after signing in: back to the page that sent you here. Only a
   page of this site, so the link can't be used to send someone elsewhere. */
const params = new URLSearchParams(location.search);
function nextPage() {
  const next = params.get('next') || '';
  return /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? './' + next : './';
}

function keep(session) {
  try { localStorage.setItem(KEY, JSON.stringify(session)); } catch { /* private mode */ }
  location.replace(nextPage());
}

/* The email is in the token Supabase put in the link; the Worker checks the
   token itself on every call, so reading it here only labels the session. */
function emailFromToken(token) {
  try {
    let part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    while (part.length % 4) part += '=';
    return String(JSON.parse(atob(part)).email || '').toLowerCase();
  } catch { return ''; }
}

async function call(path, body, token) {
  const headers = { 'content-type': 'application/json' };
  if (token) headers.authorization = 'Bearer ' + token;
  try {
    const res = await fetch(WORKER + path, { method: 'POST', headers, body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  } catch {
    return { ok: false, status: 0, data: { error: 'Couldn’t reach the server. Try again.' } };
  }
}

function busy(form, on) {
  const b = form.querySelector('button.primary');
  b.disabled = on;
}

const returnTo = location.origin + location.pathname;

forms.signin.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;
  if (!email || !password) { say('Enter your email and password.', 'bad'); return; }
  busy(forms.signin, true);
  const r = await call('/auth/signin', { email, password });
  busy(forms.signin, false);
  if (r.ok && r.data.session) { keep(r.data.session); return; }
  say(r.data.error || 'Couldn’t sign in.', 'bad');
});

forms.signup.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  if (password.length < MIN_PASSWORD) { say(`Use at least ${MIN_PASSWORD} characters for the password.`, 'bad'); return; }
  if (password !== document.getElementById('su-confirm').value) { say('The two passwords don’t match.', 'bad'); return; }
  busy(forms.signup, true);
  const r = await call('/auth/signup', { email, password, redirect_to: returnTo });
  busy(forms.signup, false);
  if (r.ok && r.data.session) { keep(r.data.session); return; }
  if (r.ok && r.data.exists) {
    show('signin', true);
    document.getElementById('si-email').value = email;
    say('That email already has an account, perhaps from another AIKO tool. Sign in with that password, or reset it.', 'ok');
    return;
  }
  if (r.ok && r.data.confirm) {
    show('signin', true);
    document.getElementById('si-email').value = email;
    say('Check your email for a link to confirm your account, then sign in here.', 'ok');
    return;
  }
  say(r.data.error || 'Couldn’t create the account.', 'bad');
});

forms.forgot.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('fp-email').value.trim();
  if (!email) { say('Enter your email.', 'bad'); return; }
  busy(forms.forgot, true);
  await call('/auth/recover', { email, redirect_to: returnTo });
  busy(forms.forgot, false);
  say('If that email is on this app’s list, a reset link is on its way.', 'ok');
});

/* A link from a Supabase email lands here with the session in the URL
   fragment: after confirming an account, or to reset a password. */
let recovery = null;
forms.reset.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('rp-password').value;
  if (password.length < MIN_PASSWORD) { say(`Use at least ${MIN_PASSWORD} characters for the password.`, 'bad'); return; }
  if (password !== document.getElementById('rp-confirm').value) { say('The two passwords don’t match.', 'bad'); return; }
  busy(forms.reset, true);
  const r = await call('/auth/password', { password }, recovery.access_token);
  busy(forms.reset, false);
  if (r.ok) { keep(recovery); return; }
  say(r.data.error || 'Couldn’t save the password.', 'bad');
});

(function start() {
  const hash = new URLSearchParams(location.hash.slice(1));
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);

  if (hash.get('error_description')) {
    show('signin');
    say(hash.get('error_description').replace(/\+/g, ' ') + '. Ask for a new link.', 'bad');
    return;
  }

  const access = hash.get('access_token');
  if (access) {
    const session = {
      access_token: access,
      refresh_token: hash.get('refresh_token') || '',
      expires_at: Math.floor(Date.now() / 1000) + (Number(hash.get('expires_in')) || 3600),
      email: emailFromToken(access),
    };
    if (hash.get('type') === 'recovery') {
      recovery = session;
      show('reset');
      return;
    }
    keep(session);
    return;
  }

  const why = params.get('why');
  show('signin');
  if (why === 'expired') say('Your session ended. Sign in again.', 'ok');
  if (why === 'not-listed') say('That email isn’t on the list for this app. Ask to be added.', 'bad');
})();
</script>
</body>
</html>
